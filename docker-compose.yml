# Full stack: Postgres, MinIO, ElasticMQ, the API and two workers.
# Only the API is published, and only on loopback. docker-compose.dev.yml adds the
# infrastructure ports for running the Go binaries on the host (see `make infra`).
x-app-env: &app-env
  DATABASE_URL: postgres://processor:processor@postgres:5432/processor?sslmode=disable
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-secret-key}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: uploads
  SQS_ENDPOINT: http://elasticmq:9324
  SQS_QUEUE_URL: http://elasticmq:9324/000000000000/jobs
  SQS_DLQ_URL: http://elasticmq:9324/000000000000/jobs-dlq
  MAX_ATTEMPTS: "3"
  SHUTDOWN_TIMEOUT: 15s

# The Go services run with a read-only root filesystem, no capabilities and no privilege gain.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    environment:
      POSTGRES_USER: processor
      POSTGRES_PASSWORD: processor
      POSTGRES_DB: processor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processor -d processor"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Chainguard publishes only a floating tag; pin the digest (MinIO RELEASE.2026-10-23T20-06-51Z).
    image: cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-local-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-local-secret-key}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticmq:
    image: softwaremill/elasticmq:1.6.12@sha256:fecd02f7b48f7c28b2dfd3d468e1085878b96c1435b339eca22c652510cd6057
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    environment:
      JAVA_OPTS: "-Xms64m -Xmx256m -XX:ActiveProcessorCount=2"
    volumes:
      - ./deploy/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:9324/?Action=ListQueues"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      args:
        SERVICE: api
    image: async-file-processor-api
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 256
    <<: *hardened
    environment:
      <<: *app-env
      GOMEMLIMIT: 300MiB
      API_ADDR: ":8080"
      API_METRICS_ADDR: ":9090"
      # Demo limits. Raise DEMO_MAX_UPLOAD_BYTES for large benchmark files.
      MAX_UPLOAD_BYTES: ${DEMO_MAX_UPLOAD_BYTES:-52428800}
      UPLOAD_RATE_PER_MIN: ${UPLOAD_RATE_PER_MIN:-10}
      UPLOAD_RATE_BURST: ${UPLOAD_RATE_BURST:-5}
      # Trust CF-Connecting-IP only when the API is reachable solely through Cloudflare.
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_IDLE_TIMEOUT: ${UPLOAD_IDLE_TIMEOUT:-30s}
      UPLOAD_MAX_DURATION: ${UPLOAD_MAX_DURATION:-10m}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-16}
      MAX_UNFINISHED_JOBS: ${MAX_UNFINISHED_JOBS:-50}
      MAX_UNFINISHED_PER_CLIENT: ${MAX_UNFINISHED_PER_CLIENT:-3}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      elasticmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: .
      args:
        SERVICE: worker
    image: async-file-processor-worker
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    <<: *hardened
    environment:
      <<: *app-env
      GOMEMLIMIT: 400MiB
      METRICS_ADDR: ":9091"
      MAX_ERROR_LINES: ${MAX_ERROR_LINES:-50000}
      MAX_RECORD_BYTES: ${MAX_RECORD_BYTES:-1048576}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      RETENTION: ${RETENTION:-24h}
      RETENTION_INTERVAL: ${RETENTION_INTERVAL:-10m}
    deploy:
      replicas: 2
    # Long poll (20s) plus SHUTDOWN_TIMEOUT (15s), with headroom.
    stop_grace_period: 45s
    # The API applies the database migrations, so workers start after it is healthy.
    depends_on:
      api: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      elasticmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
  minio-data:
